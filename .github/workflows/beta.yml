name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Beta
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      - name: Build Project
        run: |
          make OTHER_SWIFT_FLAGS="-strict-concurrency=minimal"

      - name: Rename IPA to iQsign
        run: |
          mkdir -p packages
          if [ -f packages/Ksign.ipa ]; then
            mv packages/Ksign.ipa packages/iQsign.ipa
          fi

      - name: Upload iQsign IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iQsign-IPA
          path: packages/*.ipa
          retention-days: 7

      - name: Update Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_OFFICIAL_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "## iQsign Official Build - Commit: \`$COMMIT_MSG\`" > release_notes.md
          echo "### Commit SHA: ${{ github.sha }}" >> release_notes.md

          gh release delete beta --cleanup-tag -y || true
          
          IPA_FILE=$(ls packages/*.ipa | head -n 1)
          if [ -f "$IPA_FILE" ]; then
            gh release create beta "$IPA_FILE" \
              --title "iQsign Latest Build" \
              --notes "$(cat release_notes.md)" \
              --prerelease \
              --target ${{ github.sha }}
          fi
