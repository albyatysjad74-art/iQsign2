name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iQsign
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Fix Deployment Target & Build IPA
        run: |
          # 1. خفض إصدار النظام المطلوب إلى iOS 16.0 في المشروع والحزم المحلية
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' Ksign.xcodeproj/project.pbxproj
          
          # 2. إيقاف تدقيق Swift 6 الصارم داخل المشروع
          sed -i '' 's/SWIFT_VERSION = 6.0;/SWIFT_VERSION = 5.0;/g' Ksign.xcodeproj/project.pbxproj
          sed -i '' 's/SWIFT_STRICT_CONCURRENCY = complete;/SWIFT_STRICT_CONCURRENCY = minimal;/g' Ksign.xcodeproj/project.pbxproj

          # 3. البناء المباشر بدون تعارض المعمارية
          xcodebuild \
            -project Ksign.xcodeproj \
            -scheme "Ksign" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build_data \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO

          # 4. تجميع ملف iQsign.ipa
          mkdir -p packages Payload
          APP_PATH=$(find build_data -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -vr packages/iQsign.ipa Payload -x "*.DS_Store"

      - name: Upload iQsign IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iQsign-IPA
          path: packages/iQsign.ipa
          retention-days: 7

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --cleanup-tag -y || true
          if [ -f "packages/iQsign.ipa" ]; then
            gh release create beta "packages/iQsign.ipa" \
              --title "iQsign v1.00" \
              --notes "Official iQsign Build" \
              --prerelease \
              --target ${{ github.sha }}
          fi
