name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iQsign
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Build Project
        run: |
          # 1. خفض swift-tools-version من 6.0 إلى 5.9 في كل ملفات Package.swift المحلية
          find . -name "Package.swift" -exec sed -i '' 's/swift-tools-version:[[:space:]]*6\.[0-9]*/swift-tools-version: 5.9/g' {} +

          # 2. إصلاح خطأ NBFetchService.swift السطر 17 مباشرة بإضافة @unchecked Sendable
          if [ -f "NimbleKit/Sources/NimbleJSON/NBFetchService.swift" ]; then
            sed -i '' 's/enum NBFetchServiceError: Error/enum NBFetchServiceError: Error, @unchecked Sendable/g' NimbleKit/Sources/NimbleJSON/NBFetchService.swift
            sed -i '' 's/: Error, Sendable/: Error, @unchecked Sendable/g' NimbleKit/Sources/NimbleJSON/NBFetchService.swift
          fi

          # 3. ضبط إعدادات المشروع الرئيسي (Ksign.xcodeproj) على iOS 16 و Swift 5
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' Ksign.xcodeproj/project.pbxproj
          sed -i '' 's/SWIFT_VERSION = 6.0;/SWIFT_VERSION = 5.0;/g' Ksign.xcodeproj/project.pbxproj
          sed -i '' 's/SWIFT_STRICT_CONCURRENCY = complete;/SWIFT_STRICT_CONCURRENCY = minimal;/g' Ksign.xcodeproj/project.pbxproj

          # 4. تشغيل البناء وطباعة أي خطأ متبقٍ بوضوح
          set -o pipefail
          make 2>&1 | tee build.log || (echo "=== EXACT ERRORS ===" && grep -E "error:" build.log && exit 1)

      - name: Rename IPA to iQsign
        run: |
          mkdir -p packages
          if [ -f packages/Ksign.ipa ]; then
            cp packages/Ksign.ipa packages/iQsign.ipa
          fi

      - name: Upload iQsign IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iQsign-IPA
          path: packages/*.ipa
          retention-days: 7

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --cleanup-tag -y || true
          IPA_FILE=$(ls packages/*.ipa | head -n 1)
          if [ -f "$IPA_FILE" ]; then
            gh release create beta "$IPA_FILE" \
              --title "iQsign v1.00" \
              --notes "Official iQsign Build" \
              --prerelease \
              --target ${{ github.sha }}
          fi
