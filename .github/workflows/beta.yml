name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iQsign
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Stable Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Downgrade Project Format & Build IPA
        run: |
          # 1. تحويل صيغة المشروع من 77 إلى 56 ليقبل الفتح على Xcode 15.4 بدون أخطاء Swift 6
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' Ksign.xcodeproj/project.pbxproj
          sed -i '' 's/minimizedProjectReferenceProxies = 1;//g' Ksign.xcodeproj/project.pbxproj
          sed -i '' 's/preferredProjectObjectVersion = 77;//g' Ksign.xcodeproj/project.pbxproj

          # 2. بناء المشروع مباشرة مع فرض Swift 5 وإلغاء التوقيع
          xcodebuild \
            -project Ksign.xcodeproj \
            -scheme "Ksign" \
            -configuration Release \
            -arch arm64 \
            -sdk iphoneos \
            -derivedDataPath build_data \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal

          # 3. استخراج ملف الـ .app وتحويله إلى ملف iQsign.ipa جاهز
          mkdir -p packages Payload
          APP_PATH=$(find build_data -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -vr packages/iQsign.ipa Payload -x "*.DS_Store"

      - name: Upload iQsign IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iQsign-IPA
          path: packages/iQsign.ipa
          retention-days: 7

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --cleanup-tag -y || true
          if [ -f "packages/iQsign.ipa" ]; then
            gh release create beta "packages/iQsign.ipa" \
              --title "iQsign v1.00" \
              --notes "Official iQsign Build" \
              --prerelease \
              --target ${{ github.sha }}
          fi
