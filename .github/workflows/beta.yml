name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iQsign
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Fix Swift 6 Sendable in Project & Build
        run: |
          # ضبط التزامن داخل ملف إعدادات المشروع نفسه دون التأثير على مكتبة NimbleKit
          sed -i '' 's/SWIFT_VERSION = 6.0;/SWIFT_VERSION = 5.0;/g' Ksign.xcodeproj/project.pbxproj
          sed -i '' 's/SWIFT_STRICT_CONCURRENCY = complete;/SWIFT_STRICT_CONCURRENCY = minimal;/g' Ksign.xcodeproj/project.pbxproj

          # تشغيل أمر البناء الأصلي للمستودع
          make

          # تجهيز ملف iQsign.ipa
          mkdir -p packages
          if [ -f packages/Ksign.ipa ]; then
            cp packages/Ksign.ipa packages/iQsign.ipa
          fi

      - name: Upload iQsign IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iQsign-IPA
          path: packages/*.ipa
          retention-days: 7

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --cleanup-tag -y || true
          IPA_FILE=$(ls packages/*.ipa | head -n 1)
          if [ -f "$IPA_FILE" ]; then
            gh release create beta "$IPA_FILE" \
              --title "iQsign v1.00" \
              --notes "Official iQsign Build" \
              --prerelease \
              --target ${{ github.sha }}
          fi
