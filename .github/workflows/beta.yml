name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iQsign
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build Project
        run: |
          # 1. خفض swift-tools-version إلى 5.9 في الحزم المحلية لمنع أخطاء Sendable الصارمة
          find . -name "Package.swift" -exec sed -i '' 's/swift-tools-version:[[:space:]]*6\.[0-9]*/swift-tools-version: 5.9/g' {} +

          # 2. إصلاح NBFetchServiceError ليدعم Sendable بدون اعتراض
          if [ -f "NimbleKit/Sources/NimbleJSON/NBFetchService.swift" ]; then
            sed -i '' 's/enum NBFetchServiceError: Error, LocalizedError/enum NBFetchServiceError: Error, LocalizedError, @unchecked Sendable/g' NimbleKit/Sources/NimbleJSON/NBFetchService.swift
          fi

          # 3. تحويل لغة سويفت في المشروع الرئيسي إلى Swift 5 مع تقليل تشدد التزامن (لحل خطأ SourcesViewModel.swift:75)
          sed -i '' 's/SWIFT_VERSION = 6.0;/SWIFT_VERSION = 5.0;/g' Ksign.xcodeproj/project.pbxproj
          sed -i '' 's/SWIFT_STRICT_CONCURRENCY = complete;/SWIFT_STRICT_CONCURRENCY = minimal;/g' Ksign.xcodeproj/project.pbxproj

          # 4. تمرير علم تخفيف التزامن داخل الـ makefile مباشرة
          sed -i '' 's/ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO/ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal/g' makefile

          # 5. تشغيل البناء على Xcode 26 (الذي يدعم glassEffect أصلاً)
          set -o pipefail
          make 2>&1 | tee build.log || (echo "=== EXACT ERRORS ===" && grep -E "error:" build.log && exit 1)

      - name: Rename IPA to iQsign
        run: |
          mkdir -p packages
          if [ -f packages/Ksign.ipa ]; then
            cp packages/Ksign.ipa packages/iQsign.ipa
          fi

      - name: Upload iQsign IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iQsign-IPA
          path: packages/*.ipa
          retention-days: 7

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --cleanup-tag -y || true
          IPA_FILE=$(ls packages/*.ipa | head -n 1)
          if [ -f "$IPA_FILE" ]; then
            gh release create beta "$IPA_FILE" \
              --title "iQsign v1.00" \
              --notes "Official iQsign Build" \
              --prerelease \
              --target ${{ github.sha }}
          fi
